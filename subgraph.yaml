specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: RariFoundation
    network: mainnet
    source:
      address: "0x096Bd9a7a2e703670088C05035e23c7a9F428496"
      abi: RariFoundation
      startBlock: 15669279
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Delegate
        - Delegator
      abis:
        - name: RariFoundation
          file: ./abis/RariFoundation.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: delegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: delegateVotesChanged
        - event: LockCreate(indexed uint256,indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handleLockCreate
      file: ./src/mainnet/rari-foundation.ts
  - kind: ethereum/contract
    name: ENSToken
    network: mainnet
    source:
      address: "0xc18360217d8f7ab5e7c516566761ea12ce7f9d72"
      abi: ENSToken
      startBlock: 13533400
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Delegate
        - Delegator
      abis:
        - name: ENSToken
          file: ./abis/ENSToken.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: delegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: delegateVotesChanged
      file: ./src/mainnet/ens_mapping.ts
